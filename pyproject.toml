[project]
name = "community-voice"
version = "0.1.0"
description = "Service Delivery Reporter (Community Voice): an agentic AI bootcamp project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.162.5",
    "fastmcp>=3.2.4,<4",
    "langchain>=1.5.0",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-tavily>=0.2.18",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "pillow>=13.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
# langchain-mcp-adapters needs mcp 1.x, and fastmcp 4 needs mcp 2.x, so use fastmcp 3.
constraint-dependencies = ["mcp>=1.24.0,<2.0.0"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import the evals package
# Tests that call real LLM APIs are skipped unless you run: uv run pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: calls a real LLM API (needs keys in .env and network access)",
]
